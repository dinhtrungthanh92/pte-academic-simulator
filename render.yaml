services:
  - type: web
    name: pte-academic-simulator
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SCORER_MODEL
        value: deepseek-chat
