services:
  - type: web
    name: pte-academic-simulator
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 18
      # AI scoring is optional. To enable it, add DEEPSEEK_API_KEY in the
      # Render dashboard (Environment tab). Without it the app runs in
      # offline/manual scoring mode.
