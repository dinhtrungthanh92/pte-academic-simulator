<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE Academic Simulator</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 600px; text-align: center; border: 1px solid #334155; }
  h1 { color: #38bdf8; margin-bottom: 10px; }
  p { color: #94a3b8; margin-bottom: 20px; }
  .btn { background: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  .btn:hover { background: #0369a1; }
</style>
</head>
<body>
<div class="card">
  <h1>PTE Academic Simulator</h1>
  <p>Hệ thống thi thử PTE Academic chuyên nghiệp, độc lập.</p>
  <button class="btn" onclick="alert('PTE Simulator Ready!')">Bắt đầu thi thử</button>
</div>
</body>
</html>
