function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let pool, idx, hearts, score, comboCount, timer, answered, correctInRound;
const ROUND = 10;

function init() {
  pool = [...VOCAB];
  shuffle(pool);
  idx = 0;
  hearts = 5;
  score = 0;
  comboCount = 0;
  correctInRound = 0;
  updateUI();
  nextWord();
}

function updateUI() {
  document.getElementById('hearts').innerHTML = '❤️'.repeat(hearts) + '⬛'.repeat(5 - hearts);
  document.getElementById('hDisplay').textContent = hearts;
  document.getElementById('sDisplay').textContent = score;
  document.getElementById('scoreBig').textContent = score;
}

function nextWord() {
  if (hearts <= 0 || idx >= pool.length) { gameOver(); return; }
  const word = pool[idx];
  document.getElementById('wordEn').textContent = word[0];
  document.getElementById('rDisplay').textContent = (idx % ROUND) + 1;
  const answers = document.getElementById('answers');
  answers.innerHTML = '';
  let opts = [word[1], word[2], word[3], word[4]];
  shuffle(opts);
  answered = false;
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      clearInterval(timer);
      if (opt === word[1]) {
        btn.classList.add('correct');
        comboCount++;
        const bonus = Math.min(comboCount, 5);
        score += 10 + bonus * 2;
        correctInRound++;
        document.getElementById('combo').textContent = comboCount > 1 ? '🔥 Combo ' + comboCount + ' (+' + (10+bonus*2) + ')' : '';
      } else {
        btn.classList.add('wrong');
        hearts--;
        comboCount = 0;
        document.getElementById('combo').textContent = '';
        document.querySelectorAll('.ans-btn').forEach(b => { if (b.textContent === word[1]) b.classList.add('correct'); });
      }
      updateUI();
      document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
      setTimeout(() => {
        idx++;
        if (idx % ROUND === 0 && idx < pool.length) showRoundSummary();
        else nextWord();
      }, 1000);
    };
    answers.appendChild(btn);
  });
  startTimer();
}

function startTimer() {
  const fill = document.getElementById('timerFill');
  fill.style.width = '100%';
  fill.classList.remove('urgent');
  let timeLeft = 8;
  timer = setInterval(() => {
    timeLeft -= 0.1;
    const pct = (timeLeft / 8) * 100;
    fill.style.width = Math.max(0, pct) + '%';
    if (pct < 25) fill.classList.add('urgent');
    if (timeLeft <= 0 && !answered) {
      answered = true;
      clearInterval(timer);
      hearts--;
      comboCount = 0;
      updateUI();
      document.getElementById('combo').textContent = '';
      document.querySelectorAll('.ans-btn').forEach(b => { if (b.textContent === pool[idx][1]) b.classList.add('correct'); b.disabled = true; });
      setTimeout(() => { idx++; if (idx % ROUND === 0 && idx < pool.length) showRoundSummary(); else if (idx < pool.length) nextWord(); else gameOver(); }, 1000);
    }
  }, 100);
}

function showRoundSummary() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlayContent').innerHTML = '<h2>📊 Hết ' + ROUND + ' từ!</h2><div class="final-score">' + score + '</div><div class="final-detail">❤️ Còn ' + hearts + ' mạng<br>✅ Đúng vòng này: ' + correctInRound + '/' + ROUND + '<br>🏆 Tổng điểm: ' + score + '</div><button class="btn-primary" onclick="closeOverlay()">Tiếp tục 🔥</button>';
  correctInRound = 0;
}

function closeOverlay() { document.getElementById('overlay').classList.remove('show'); nextWord(); }

function gameOver() {
  clearInterval(timer);
  document.getElementById('overlay').classList.add('show');
  let review = '';
  const start = Math.max(0, idx - 20);
  for (let i = start; i < idx; i++) { const w = pool[i]; review += '<div class="review-word"><span class="rw-en">' + w[0] + '</span><span class="rw-vi">' + w[1] + '</span></div>'; }
  document.getElementById('overlayContent').innerHTML = '<h2>🎮 Game Over</h2><div class="final-score">' + score + '</div><div class="final-detail">📝 Đã học: ' + idx + ' từ<br>❤️ Mạng còn: ' + hearts + '</div><div class="review-section"><div style="font-weight:700;margin-bottom:8px;color:rgba(255,255,255,0.7);font-size:0.85rem;">📖 Từ vừa học:</div>' + review + '</div><button class="btn-primary" onclick="restart()">🔄 Chơi lại</button>';
}

function restart() { document.getElementById('overlay').classList.remove('show'); init(); }

init();
</script>
