<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE Academic Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 700px; border: 1px solid #334155; text-align: center; }
  h1 { color: #38bdf8; margin-bottom: 10px; font-size: 1.8rem; }
  p { color: #94a3b8; margin-bottom: 20px; }
  .btn { background: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  .btn:hover { background: #0369a1; }
  .exam-container { display: none; text-align: left; margin-top: 20px; border-top: 1px solid #334155; padding-top: 20px; }
  .question { font-size: 1.1rem; margin-bottom: 15px; color: #e2e8f0; font-weight: 600; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .option { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: #cbd5e1; }
  .option:hover { background: #334155; color: #fff; }
  .option.selected { background: #0284c7; border-color: #38bdf8; color: #fff; }
  .nav-btns { display: flex; justify-content: space-between; align-items: center; }
  .score-card { font-size: 1.5rem; color: #34d399; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<div class="card" id="welcomeCard">
  <h1>PTE Academic Simulator</h1>
  <p>Hệ thống thi thử PTE Academic chính thức (Speaking, Writing, Reading, Listening).</p>
  <button class="btn" onclick="startExam()">Bắt đầu thi thử</button>
</div>

<div class="card exam-container" id="examCard">
  <div style="display: flex; justify-content: space-between; margin-bottom: 15px; color: #94a3b8; font-size: 0.9rem;">
    <span id="questionNum">Câu hỏi 1 / 3</span>
    <span>Thời gian: <span id="timer" style="color: #f87171; font-weight: bold;">30:00</span></span>
  </div>
  <div class="question" id="questionText">Loading question...</div>
  <div class="options" id="optionsContainer"></div>
  <div class="nav-btns">
    <button class="btn" style="background: #475569;" onclick="prevQuestion()">Quay lại</button>
    <button class="btn" onclick="nextQuestion()" id="nextBtn">Câu tiếp theo</button>
  </div>
</div>

<div class="card exam-container" id="resultCard" style="text-align: center;">
  <h1>Kết quả thi thử PTE Academic</h1>
  <p>Bạn đã hoàn thành bài thi mô phỏng.</p>
  <div class="score-card" id="finalScore">Overall Score: 79 / 90</div>
  <button class="btn" style="margin-top: 20px;" onclick="location.reload()">Làm lại bài thi</button>
</div>

<script>
const questions = [
  {
    question: "Read aloud: Look at the text below. Read the text aloud as naturally and clearly as possible.",
    options: [
      "A. Environmental degradation is one of the most critical issues facing modern society.",
      "B. Economic growth always guarantees environmental preservation without regulation.",
      "C. Technological advancements have eliminated all forms of pollution completely.",
      "D. Industrial expansion has no correlation with ecological changes."
    ],
    correct: 0
  },
  {
    question: "Multiple Choice (Single Answer): What is the primary cause of global temperature rise according to recent studies?",
    options: [
      "A. Increased solar activity and volcanic eruptions",
      "B. Anthropogenic greenhouse gas emissions",
      "C. Natural oceanic current fluctuations",
      "D. Orbital variations of the Earth"
    ],
    correct: 1
  },
  {
    question: "Fill in the blanks: The government implemented strict policies to ___ carbon emissions over the next decade.",
    options: [
      "A. accelerate",
      "B. curb",
      "C. magnify",
      "D. generate"
    ],
    correct: 1
  }
];

let currentIdx = 0;
let userAnswers = {};

function startExam() {
  document.getElementById('welcomeCard').style.display = 'none';
  document.getElementById('examCard').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  const q = questions[currentIdx];
  document.getElementById('questionNum').textContent = `Câu hỏi ${currentIdx + 1} / ${questions.length}`;
  document.getElementById('questionText').textContent = q.question;
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option' + (userAnswers[currentIdx] === idx ? ' selected' : '');
    div.textContent = opt;
    div.onclick = () => {
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      userAnswers[currentIdx] = idx;
    };
    container.appendChild(div);
  });
  
  document.getElementById('nextBtn').textContent = currentIdx === questions.length - 1 ? 'Nộp bài' : 'Câu tiếp theo';
}

function nextQuestion() {
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    loadQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentIdx > 0) {
    currentIdx--;
    loadQuestion();
  }
}

function showResult() {
  document.getElementById('examCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  
  let correctCount = 0;
  questions.forEach((q, idx) => {
    if (userAnswers[idx] === q.correct) correctCount++;
  });
  
  const score = Math.round((correctCount / questions.length) * 90);
  document.getElementById('finalScore').textContent = `Overall Score: ${score} / 90 (${correctCount}/${questions.length} đúng)`;
}
</script>
</body>
</html>
